name: Build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    outputs:
      llvm-major: ${{ steps.llvm.outputs.major }}

    steps:
      - name: Checkout source.
        uses: actions/checkout@v4

      - name: Install LLVM.
        id: llvm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          choco upgrade llvm -y
          $version = ((& "C:\Program Files\LLVM\bin\clang.exe" --version)[0] -split ' ')[2]

          gh release download "llvmorg-$version" --repo llvm/llvm-project --pattern "clang+llvm-$version-aarch64-pc-windows-msvc.tar.xz" --output llvm-aarch64.tar.xz
          7z x llvm-aarch64.tar.xz -y | Out-Null
          7z e llvm-aarch64.tar -ollvm-aarch64 LLVM-C.dll LLVM-C.lib -r -y | Out-Null

          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          "version=$version" >> $env:GITHUB_OUTPUT
          "major=$($version.Split('.')[0])" >> $env:GITHUB_OUTPUT

      - name: Build compiler.
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force dist\windows-amd64 | Out-Null
          .\bin\zirconc.exe src/Main.zir -o dist\windows-amd64\zirconc.exe -L"C:\Program Files\LLVM\lib" -lLLVM-C -lDbgHelp -g -v
          Copy-Item "C:\Program Files\LLVM\bin\LLVM-C.dll" dist\windows-amd64\

      - name: Build compiler for Windows ARM64.
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force dist\windows-arm64 | Out-Null
          .\bin\zirconc.exe src/Main.zir -o dist\windows-arm64\zirconc.exe -target aarch64-pc-windows-msvc -L"$PWD\llvm-aarch64" -lLLVM-C -lDbgHelp -g -v
          Copy-Item llvm-aarch64\LLVM-C.dll dist\windows-arm64\

      - name: Compile objects for Linux and macOS.
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force dist\objects | Out-Null

          $targets = @{
            'linux-amd64' = 'x86_64-unknown-linux-gnu'
            'linux-arm64' = 'aarch64-unknown-linux-gnu'
            'darwin-amd64' = 'x86_64-apple-macosx11.0'
            'darwin-arm64' = 'arm64-apple-macosx11.0'
          }

          foreach ($name in $targets.Keys) {
            .\bin\zirconc.exe src/Main.zir -o "dist\objects\zirconc-$name.o" -c -target $targets[$name] -v
          }

      - name: Upload Windows AMD64 compiler.
        uses: actions/upload-artifact@v4
        with:
          name: zirconc-windows-amd64
          path: |
            dist/windows-amd64/zirconc.exe
            dist/windows-amd64/LLVM-C.dll

      - name: Upload Windows ARM64 compiler.
        uses: actions/upload-artifact@v4
        with:
          name: zirconc-windows-arm64
          path: |
            dist/windows-arm64/zirconc.exe
            dist/windows-arm64/LLVM-C.dll

      - name: Upload objects.
        uses: actions/upload-artifact@v4
        with:
          name: objects
          path: dist/objects

  linux:
    needs: windows

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            multiarch: x86_64-linux-gnu
            loader: /lib64/ld-linux-x86-64.so.2
          - arch: arm64
            runner: ubuntu-24.04-arm
            multiarch: aarch64-linux-gnu
            loader: /lib/ld-linux-aarch64.so.1

    runs-on: ${{ matrix.runner }}

    env:
      LLVM_MAJOR: ${{ needs.windows.outputs.llvm-major }}

    steps:
      - name: Checkout source.
        uses: actions/checkout@v4

      - name: Download objects.
        uses: actions/download-artifact@v4
        with:
          name: objects
          path: objects

      - name: Install LLVM.
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "$LLVM_MAJOR"
          sudo ln -sf "/usr/bin/ld.lld-$LLVM_MAJOR" /usr/local/bin/ld.lld

      - name: Link compiler.
        run: |
          ld.lld --nostdlib --entry _start --dynamic-linker ${{ matrix.loader }} -o zirconc objects/zirconc-linux-${{ matrix.arch }}.o \
            -L"/usr/lib/llvm-$LLVM_MAJOR/lib" -lLLVM -L/usr/lib/${{ matrix.multiarch }} -l:libc.so.6
          ./zirconc --version

      - name: Rebuild compiler natively.
        run: |
          ./zirconc src/Main.zir -o zirconc2 -L"/usr/lib/llvm-$LLVM_MAJOR/lib" -lLLVM -v
          ./zirconc2 src/Main.zir -o zirconc3 -L"/usr/lib/llvm-$LLVM_MAJOR/lib" -lLLVM
          cmp zirconc2 zirconc3
          mv zirconc2 zirconc

      - name: Upload compiler.
        uses: actions/upload-artifact@v4
        with:
          name: zirconc-linux-${{ matrix.arch }}
          path: zirconc

  darwin:
    needs: windows

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
            cc-arch: x86_64
          - arch: arm64
            runner: macos-latest
            cc-arch: arm64

    runs-on: ${{ matrix.runner }}

    env:
      LLVM_MAJOR: ${{ needs.windows.outputs.llvm-major }}

    steps:
      - name: Checkout source.
        uses: actions/checkout@v4

      - name: Download objects.
        uses: actions/download-artifact@v4
        with:
          name: objects
          path: objects

      - name: Install LLVM.
        run: |
          if brew install "llvm@$LLVM_MAJOR"; then
            echo "LLVM_LIB=$(brew --prefix "llvm@$LLVM_MAJOR")/lib" >> "$GITHUB_ENV"
          else
            brew install llvm
            echo "LLVM_LIB=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          fi

      - name: Link compiler.
        run: |
          cc -arch ${{ matrix.cc-arch }} objects/zirconc-darwin-${{ matrix.arch }}.o -o zirconc -L"$LLVM_LIB" -lLLVM -Wl,-rpath,"$LLVM_LIB"
          ./zirconc --version

      - name: Rebuild compiler natively.
        run: |
          ./zirconc src/Main.zir -o zirconc2 -L"$LLVM_LIB" -lLLVM -v
          ./zirconc2 src/Main.zir -o zirconc3 -L"$LLVM_LIB" -lLLVM
          ./zirconc3 --version
          mv zirconc2 zirconc

      - name: Upload compiler.
        uses: actions/upload-artifact@v4
        with:
          name: zirconc-darwin-${{ matrix.arch }}
          path: zirconc

  release:
    needs: [windows, linux, darwin]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write

    env:
      LLVM_MAJOR: ${{ needs.windows.outputs.llvm-major }}

    steps:
      - name: Checkout source.
        uses: actions/checkout@v4

      - name: Download compilers.
        uses: actions/download-artifact@v4
        with:
          pattern: zirconc-*
          path: compilers

      - name: Package compilers.
        run: |
          mkdir packages

          for directory in compilers/zirconc-*; do
            name=$(basename "$directory")
            mkdir -p "staging/$name/bin"
            cp -r include README.md LICENSE "staging/$name/"

            if [[ $name == *windows* ]]; then
              cp "$directory/zirconc.exe" "$directory/LLVM-C.dll" "staging/$name/bin/"
              (cd staging && zip -qr "../packages/$name.zip" "$name")
            else
              install -m 755 "$directory/zirconc" "staging/$name/bin/zirconc"
              tar -czf "packages/$name.tar.gz" -C staging "$name"
            fi
          done

      - name: Publish release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built with LLVM $LLVM_MAJOR. Windows packages include LLVM-C.dll; on Linux and macOS install LLVM $LLVM_MAJOR (libLLVM)."

          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" packages/* --title "$(head -n 1 README.md | sed 's/^# //; s/\r$//')" --notes "$notes" --generate-notes
          else
            gh release delete nightly --cleanup-tag --yes || true
            gh release create nightly packages/* --prerelease --target "$GITHUB_SHA" --title "Nightly" --notes "Built from $GITHUB_SHA. $notes"
          fi
